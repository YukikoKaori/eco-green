# Application Settings
spring.application.name=EV Dealer Management System

# Server Configuration - Quan tr?ng cho deployment
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://root:JgsvwyFjmdMyqgTdfzBrKjepzMBPNoGi@yamabiko.proxy.rlwy.net:42928/railway
spring.datasource.username=root
spring.datasource.password=JgsvwyFjmdMyqgTdfzBrKjepzMBPNoGi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings - Quan tr?ng cho stability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=${JWT_SECRET:MySuperSecretKey1234567890MySuperSecretKey}
jwt.expiration=${JWT_EXPIRATION:10800000}

# Logging for production
logging.level.root=INFO
logging.level.com.evdealer=INFO
logging.level.org.springframework.security=WARN

# Health check endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.forward-headers-strategy=framework
